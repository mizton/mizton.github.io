<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mizton Apps</title>
  <style>
    body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
           max-width: 600px; margin: 80px auto; padding: 0 20px; color: #333; text-align: center; }
    h1   { font-size: 2em; color: #1a1a2e; }
    p    { color: #666; }
    .apps { display: flex; gap: 20px; justify-content: center; margin-top: 40px; flex-wrap: wrap; }
    .app  { background: #f5f5f7; border-radius: 16px; padding: 24px 32px; text-decoration: none; color: #333; }
    .app:hover { background: #e8e8ed; }
    .app h2 { margin: 0 0 8px; font-size: 1.2em; }
    .app p  { margin: 0; font-size: 13px; color: #888; }
    .footer { margin-top: 60px; color: #bbb; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Mizton</h1>
  <p>简洁好用的本地播放器</p>
  <div class="apps">
    <a class="app" href="/privacy/mizplayer/">
      <h2>🎵 MizPlayer</h2>
      <p>本地音乐播放器</p>
    </a>
    <a class="app" href="/privacy/vizplayer/">
      <h2>🎬 VizPlayer</h2>
      <p>本地视频播放器</p>
    </a>
  </div>
  <div class="footer">© 2025 Mizton · mizton@163.com</div>
</body>
</html>
